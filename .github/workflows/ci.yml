name: CI - Integración Continua

on:
  push:
    branches: [ main, sojo ]
  pull_request:
    branches: [ main, sojo ]

jobs:
  build-and-test:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente (Checkout)
      uses: actions/checkout@v4

    - name: Configurar entorno .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependencias NuGet (API y Web)
      run: |
        dotnet restore MantenimientoApi/MantenimientoApi.slnx
        dotnet restore Web-Mantenimiento/Web-Mantenimiento.slnx

    - name: Compilar solución API en modo Release
      run: dotnet build MantenimientoApi/MantenimientoApi.slnx --no-restore --configuration Release

    - name: Compilar solución Web MVC en modo Release
      run: dotnet build Web-Mantenimiento/Web-Mantenimiento.slnx --no-restore --configuration Release

    - name: Ejecutar pruebas unitarias y de integración
      run: dotnet test MantenimientoApi/MantenimientoApi.slnx --no-build --configuration Release --verbosity normal
